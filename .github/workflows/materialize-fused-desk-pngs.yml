name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788565818.86925625f79db75e/w0wGkmnoam6C/first_viewport_fused_desk.png 662435 f3c4086a9919051bb994c3d3801d763d
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788565818.df17303b4b16be77/wOw2kkn8atKr/first_viewport_motion_a.png 663428 96a8ee5ff8c72730e74daad524107b20
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          test "$(md5sum evidence/denser_center_first_viewport_fused_desk.png | awk '{print $1}')" = "f3c4086a9919051bb994c3d3801d763d"
          test "$(md5sum evidence/denser_center_first_viewport_motion_a.png | awk '{print $1}')" = "96a8ee5ff8c72730e74daad524107b20"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png
          git commit -m "Add product-hero first viewport PNGs"
          git push
