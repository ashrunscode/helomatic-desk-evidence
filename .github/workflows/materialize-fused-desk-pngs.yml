name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788565240.add80fbb7dfdc339/wOw6kAnb77my/first_viewport_fused_desk.png 678943 82e28de04fed95b3e1a840ebf4b36e7e
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788565240.3f426b99893de6bc/wZwTkynH7UPm/first_viewport_motion_a.png 677805 1245128d216aae07a7980b513590b7d0
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          test "$(md5sum evidence/denser_center_first_viewport_fused_desk.png | awk '{print $1}')" = "82e28de04fed95b3e1a840ebf4b36e7e"
          test "$(md5sum evidence/denser_center_first_viewport_motion_a.png | awk '{print $1}')" = "1245128d216aae07a7980b513590b7d0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png
          git commit -m "Add equal-pane first viewport PNGs"
          git push
