name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788566655.8bf48b9712b69681/wbwFkqnVinQf/first_viewport_fused_desk.png 508993 56db626583c8b26861178755ec43b77b
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788566660.340c32c72e36bf42/wMwZk6n7iJzT/first_viewport_motion_a.png 510438 4993416e6a4ed388920c5a0e1d2d5dc2
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          test "$(md5sum evidence/denser_center_first_viewport_fused_desk.png | awk '{print $1}')" = "56db626583c8b26861178755ec43b77b"
          test "$(md5sum evidence/denser_center_first_viewport_motion_a.png | awk '{print $1}')" = "4993416e6a4ed388920c5a0e1d2d5dc2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png
          git commit -m "Add floated-window first viewport PNGs"
          git push
