name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788563394.53401e0593e0575f/wMwzk2nnwtil/first_viewport_fused_desk.png 577027 d23ae831b8624dbaa3670be4acdc5c0d
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788563395.cd9509abdcf07114/wHwMkCnFwgIk/first_viewport_motion_a.png 574944 715a3972bb24a87f0344b4f4951d25e3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png
          git commit -m "Add work-surface first viewport PNGs"
          git push
