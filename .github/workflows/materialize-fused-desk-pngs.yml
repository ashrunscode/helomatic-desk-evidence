name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788562546.c798c1df89cf4e28/wew6kdc0hwRD/first_viewport_fused_desk.png 573674 286661bab2d28f8be5b64d7ee78befcb
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788562546.971b04bcd5d472f8/wjwdkkc9hWFa/first_viewport_motion_a.png 572253 4e45028bf0d97192a0e53ec2a165ac07
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png
          git commit -m "Add instrumented-desk first viewport PNGs"
          git push
