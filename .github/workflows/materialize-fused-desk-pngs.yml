name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fsSL -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://litter.catbox.moe/gd7d0d.png 817210 a7df26aa551c2051a1cd0a05d7d7c247
          fetch evidence/first_viewport_motion_a.png https://litter.catbox.moe/qdonl9.png 821465 804b5d115ace04a17f1d07dc0e728821
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png
          git commit -m "Add pulled-back first viewport PNGs"
          git push
