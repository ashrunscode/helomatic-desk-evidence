name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fsSL -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://litter.catbox.moe/pq5jan.png 1074725 c4f1cbe41a1fc8598bb67dc92d544f33
          fetch evidence/first_viewport_motion_a.png https://litter.catbox.moe/ntb21q.png 1076410 23eaa0add874a6ef1f5d760c16b9936a
          fetch evidence/first_viewport_motion_b.png https://litter.catbox.moe/1qs3nt.png 1062266 1932ef4d34bbb8ce36f4a686a363dbc1
          fetch evidence/first_viewport_sliding_examples.png https://litter.catbox.moe/xgkrs7.png 1052452 a57b0452785c33f3a8728956d4b509d4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/first_viewport_motion_b.png evidence/first_viewport_sliding_examples.png
          git commit -m "Add fused desk and motion evidence PNGs"
          git push
