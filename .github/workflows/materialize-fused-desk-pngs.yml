name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788563881.23079e75b1cf4764/wzwgk1nF6yLK/first_viewport_fused_desk.png 608693 b14a0ba53f4bad03cb53282fbf668286
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788563881.49f7bdea68f6905d/wtwNklnm6fHD/first_viewport_motion_a.png 605539 1d9e0126c3143f70d0155cb366080e45
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png
          git commit -m "Add multi-surface first viewport PNGs"
          git push
