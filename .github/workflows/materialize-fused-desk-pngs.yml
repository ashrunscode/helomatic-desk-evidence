name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788560728.e9d441110c2718e3/w8wFktcwakqC/first_viewport_fused_desk.png 809050 a630239e1a1033ff99ff3062b6795e1c
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788560736.6de6ec801e1cdeab/w4wQk4cgvqcT/first_viewport_motion_a.png 798756 e1b22dc483121f543a71532890c4623c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png
          git commit -m "Add calm-chrome first viewport PNGs"
          git push
