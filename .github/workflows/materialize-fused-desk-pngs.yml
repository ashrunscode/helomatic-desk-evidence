name: materialize-fused-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-fused-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit fused PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" url="$2" bytes="$3" hash="$4"
            curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"
            test "$(wc -c < "$dest")" -eq "$bytes"
            test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ')" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png https://tmpfiles.org/dl/1788564900.30f4c3f37405db69/wFwXkTnd55eH/denser_center_first_viewport_fused_desk.png 645368 403e3233c1b4550016398815ae85f041
          fetch evidence/first_viewport_motion_a.png https://tmpfiles.org/dl/1788564900.54bfe6b549d74f85/w7wDkXnG5gfP/denser_center_first_viewport_motion_a.png 643075 be23e21546d239dd744df408d0aedc26
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          test "$(md5sum evidence/denser_center_first_viewport_fused_desk.png | awk '{print $1}')" = "403e3233c1b4550016398815ae85f041"
          test "$(md5sum evidence/denser_center_first_viewport_motion_a.png | awk '{print $1}')" = "be23e21546d239dd744df408d0aedc26"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png
          git commit -m "Add denser-center first viewport PNGs"
          git push
