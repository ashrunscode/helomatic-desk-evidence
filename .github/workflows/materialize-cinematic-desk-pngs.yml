name: materialize-cinematic-desk-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-cinematic-desk-pngs.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit cinematic first-viewport PNGs
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            local dest="$1" bytes="$2" hash="$3"
            shift 3
            local ok=0
            local url
            for url in "$@"; do
              if curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"; then
                if test "$(wc -c < "$dest")" -eq "$bytes" && test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"; then
                  ok=1
                  break
                fi
              fi
            done
            test "$ok" -eq 1
            file "$dest" | grep -q PNG
            test "$(od -An -tx1 -N4 "$dest" | tr -d ' ' )" = "89504e47"
          }
          fetch evidence/first_viewport_fused_desk.png 572262 a5e1b7cb114a29b11ec73878c12acfef https://litter.catbox.moe/v1exex.png https://tmpfiles.org/dl/1788572997.9a769179c94c1d09/wKwMkoM6kUPg/first_viewport_fused_desk.png
          fetch evidence/first_viewport_motion_a.png 534505 876adda38ee7faa3b90c209d8bfc15a9 https://litter.catbox.moe/pw4obb.png https://tmpfiles.org/dl/1788572997.b57938bbfcc318cf/wJwektMAkpqm/first_viewport_motion_a.png
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          cp evidence/first_viewport_fused_desk.png evidence/floated_window_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/floated_window_first_viewport_motion_a.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png evidence/floated_window_first_viewport_fused_desk.png evidence/floated_window_first_viewport_motion_a.png
          git commit -m "Land cinematic first-viewport fused and motion stills"
          git push
