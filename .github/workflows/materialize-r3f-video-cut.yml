name: materialize-r3f-video-cut
on:
  push:
    paths:
      - ".github/workflows/materialize-r3f-video-cut.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stills and R3F-video-cut tarball
        run: |
          set -euo pipefail
          mkdir -p evidence evidence/ship-gate
          fetch() {
            local dest="$1" bytes="$2" hash="$3"
            shift 3
            local ok=0
            local url
            for url in "$@"; do
              if curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"; then
                if test "$(wc -c < "$dest")" -eq "$bytes" && test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"; then
                  ok=1
                  break
                fi
              fi
            done
            test "$ok" -eq 1
          }
          fetch evidence/first_viewport_fused_desk.png 614637 8ea0190b84cc08d4e8d0ec397c207556 https://litter.catbox.moe/sj3u2l.png https://tmpfiles.org/dl/1788575102.732878bcdd16eace/wVwyksUSLSQG/first_viewport_fused_desk.png
          fetch evidence/first_viewport_motion_a.png 508295 c4cd6313f10d70f02a0b1b02c6f87492 https://litter.catbox.moe/w8clcd.png https://tmpfiles.org/dl/1788575103.d7d39562a8ae18f8/wqwtkzUVLmRH/first_viewport_motion_a.png
          fetch evidence/ship-gate/helomatic-www-r3f-video-cut.tgz 1332389 76afe392d347179f4cc9fc9dd8c3f9c5 https://litter.catbox.moe/240w42.tgz https://tmpfiles.org/dl/1788575103.ad45eff5c826db34/wvwQkDUwLLIh/helomatic-www-r3f-video-cut.tgz
          test "$(od -An -tx1 -N4 evidence/first_viewport_fused_desk.png | tr -d ' ')" = "89504e47"
          test "$(od -An -tx1 -N4 evidence/first_viewport_motion_a.png | tr -d ' ')" = "89504e47"
          test "$(od -An -tx1 -N2 evidence/ship-gate/helomatic-www-r3f-video-cut.tgz | tr -d ' ')" = "1f8b"
          cp evidence/first_viewport_fused_desk.png evidence/denser_center_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_motion_a.png
          cp evidence/first_viewport_fused_desk.png evidence/floated_window_first_viewport_fused_desk.png
          cp evidence/first_viewport_motion_a.png evidence/floated_window_first_viewport_motion_a.png
          printf '%s\n' \
            'https://raw.githubusercontent.com/ashrunscode/helomatic-desk-evidence/main/evidence/ship-gate/helomatic-www-r3f-video-cut.tgz' \
            '# 1332389 bytes  md5 76afe392d347179f4cc9fc9dd8c3f9c5' \
            '# source 6d5f7a9 / fused 8ea0190b / 614637 / motion c4cd6313 / 508295' \
            '# banned absent: Hellomatic | Hello Matic | Halomatic' \
            '# wrangler deploy from extract; name=helomatic-www; no apex' \
            '# no deploy from this workflow' \
            > evidence/ship-gate/R3F-VIDEO-TGZ.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_fused_desk.png evidence/first_viewport_motion_a.png evidence/denser_center_first_viewport_fused_desk.png evidence/denser_center_first_viewport_motion_a.png evidence/floated_window_first_viewport_fused_desk.png evidence/floated_window_first_viewport_motion_a.png evidence/ship-gate/helomatic-www-r3f-video-cut.tgz evidence/ship-gate/R3F-VIDEO-TGZ.txt
          git commit -m "Land R3F-video-cut stills and deploy tarball"
          git push
