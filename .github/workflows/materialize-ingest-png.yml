name: materialize-ingest-png
on:
  push:
    paths:
      - "evidence/parts/w4/**"
      - ".github/workflows/materialize-ingest-png.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNG
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(evidence/parts/w4/*)
          echo "part count ${#parts[@]}"
          test "${#parts[@]}" -eq 78
          cat evidence/parts/w4/* | tr -d '\n' | base64 -d > evidence/first_viewport_desk_ingesting_url.png
          test "$(wc -c < evidence/first_viewport_desk_ingesting_url.png)" -eq 237326
          test "$(md5sum evidence/first_viewport_desk_ingesting_url.png | awk '{print $1}')" = "c2302797284c373a81e73193adf1f05c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/first_viewport_desk_ingesting_url.png
          git commit -m "Add 1440 ingest PNG bytes"
          git push
