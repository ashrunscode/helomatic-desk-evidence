name: materialize-ship-gate-tgz
on:
  push:
    paths:
      - ".github/workflows/materialize-ship-gate-tgz.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch helomatic-www craft-cut tarball
        run: |
          set -euo pipefail
          mkdir -p evidence/ship-gate
          fetch() {
            local dest="$1" bytes="$2" hash="$3"
            shift 3
            local ok=0
            for url in "$@"; do
              if curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"; then
                if [ "$(wc -c < "$dest")" -eq "$bytes" ] && [ "$(md5sum "$dest" | awk '{print $1}')" = "$hash" ]; then
                  ok=1
                  break
                fi
              fi
            done
            test "$ok" -eq 1
          }
          fetch evidence/ship-gate/helomatic-www-craft-cut.tgz 650809 2ea12fe9387a7d0dfc6088e25038ad4c \
            https://litter.catbox.moe/mlvj8l.tgz \
            https://tmpfiles.org/dl/1788570950.3decf23409e84a9c/wTwLktMFvB28/helomatic-www-craft-cut.tgz
          printf '%s\n' \
            'https://raw.githubusercontent.com/ashrunscode/helomatic-desk-evidence/main/evidence/ship-gate/helomatic-www-craft-cut.tgz' \
            '# 650809 bytes  md5 2ea12fe9387a7d0dfc6088e25038ad4c' \
            '# source 6c6764cc / fused f254d9a9' \
            '# wrangler deploy from extract; name=helomatic-www; no apex' \
            '# no deploy from this workflow' \
            > evidence/ship-gate/TGZ.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ship-gate/helomatic-www-craft-cut.tgz evidence/ship-gate/TGZ.txt
          git commit -m "Materialize helomatic-www craft-cut deploy tarball"
          git push
