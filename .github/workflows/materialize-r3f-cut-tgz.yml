name: materialize-r3f-cut-tgz
on:
  push:
    paths:
      - ".github/workflows/materialize-r3f-cut-tgz.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch helomatic-www R3F-cut tarball
        run: |
          set -euo pipefail
          mkdir -p evidence/ship-gate
          fetch() {
            local dest="$1" bytes="$2" hash="$3"
            shift 3
            local ok=0
            local url
            for url in "$@"; do
              if curl -fL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o "$dest" "$url"; then
                if test "$(wc -c < "$dest")" -eq "$bytes" && test "$(md5sum "$dest" | awk '{print $1}')" = "$hash"; then
                  ok=1
                  break
                fi
              fi
            done
            test "$ok" -eq 1
            test "$(od -An -tx1 -N2 "$dest" | tr -d ' ')" = "1f8b"
          }
          fetch evidence/ship-gate/helomatic-www-r3f-cut.tgz 653253 aa69e65a86db47f29eefcce978a39fc9 https://litter.catbox.moe/cd7lzg.tgz https://tmpfiles.org/dl/1788574595.38b76e5dbb4ff5e1/wYwLkSUtZf7T/helomatic-www-r3f-cut.tgz
          printf '%s\n' \
            'https://raw.githubusercontent.com/ashrunscode/helomatic-desk-evidence/main/evidence/ship-gate/helomatic-www-r3f-cut.tgz' \
            '# 653253 bytes  md5 aa69e65a86db47f29eefcce978a39fc9' \
            '# source cd69b908 / fused a5e1b7cb / motion 876adda3 / evidence fc091fd' \
            '# banned absent: Hellomatic | Hello Matic | Halomatic' \
            '# wrangler deploy from extract; name=helomatic-www; no apex' \
            '# no deploy from this workflow' \
            > evidence/ship-gate/R3F-TGZ.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ship-gate/helomatic-www-r3f-cut.tgz evidence/ship-gate/R3F-TGZ.txt
          git commit -m "Materialize helomatic-www R3F-cut deploy tarball"
          git push
